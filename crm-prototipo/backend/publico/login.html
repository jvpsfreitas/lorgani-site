<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — L'Organi Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bordo:#8A2517;--grad:linear-gradient(135deg,#9E3620,#701D10);--creme:#F7EFE0;--borda:#E7D8C0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Jost,system-ui,sans-serif;background:var(--creme)}
.caixa{background:#fff;border:1px solid var(--borda);border-radius:18px;padding:38px 36px;
  width:min(400px,92vw);box-shadow:0 24px 60px -30px rgba(94,23,13,.4);text-align:center}
.logo{width:64px;height:64px;object-fit:contain;margin-bottom:10px}
h1{font-family:Fraunces,serif;font-size:24px;margin:0 0 2px;color:#2B2622}
p{color:#6B635A;font-size:13.5px;margin:0 0 24px}
label{display:block;text-align:left;font-size:12.5px;color:#6B635A;margin:14px 0 5px}
input{width:100%;padding:11px 13px;border:1px solid var(--borda);border-radius:10px;
  font-family:Jost;font-size:14.5px}
input:focus{outline:2px solid rgba(138,37,23,.25);border-color:var(--bordo)}
button{width:100%;margin-top:22px;padding:13px;border:none;border-radius:100px;cursor:pointer;
  background:var(--grad);color:#fff;font-family:Jost;font-size:15px;font-weight:600;
  box-shadow:0 8px 20px -8px rgba(122,32,20,.6);transition:transform .15s}
button:hover{transform:translateY(-1px)}
.erro{display:none;margin-top:14px;background:#F8E7E3;color:#A32D2D;border-radius:9px;
  padding:9px;font-size:13px}
.rodape{margin-top:22px;font-size:11.5px;color:#A79E92}
</style>
</head>
<body>
<form class="caixa" onsubmit="entrar(event)">
  <img class="logo" src="/logo.png" alt="" onerror="this.style.display='none'">
  <h1>L'Organi Flow</h1>
  <p>Gestão da clínica · acesso restrito</p>
  <label for="email">E-mail</label>
  <input id="email" type="email" autocomplete="username" placeholder="voce@lorgani.com.br" required>
  <label for="senha">Senha</label>
  <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••" required>
  <button type="submit" id="bt">Entrar</button>
  <div class="erro" id="erro"></div>
  <div class="rodape">Acesso registrado em auditoria · LGPD</div>
</form>
<script>
async function entrar(e){
  e.preventDefault();
  const bt = document.getElementById('bt'), erro = document.getElementById('erro');
  bt.textContent = 'Entrando...'; erro.style.display = 'none';
  try{
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: email.value, senha: senha.value })
    });
    const d = await r.json();
    if (r.ok) { window.location.href = '/app'; return; }
    erro.textContent = d.erro || 'Não foi possível entrar.';
    erro.style.display = 'block';
  } catch (_) {
    erro.textContent = 'Servidor fora do ar. Confira se o server.js está rodando.';
    erro.style.display = 'block';
  }
  bt.textContent = 'Entrar';
}
</script>
</body>
</html>
